spring.application.name=ems-back

spring.datasource.url=jdbc:postgresql://localhost:5433/ems
spring.datasource.username=postgres
spring.datasource.password=123456
management.endpoints.web.exposure.include=*
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.datasource.driver-class-name=org.postgresql.Driver
spring.main.allow-circular-references=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
node.name=Simon
downstream.url=http://34.229.77.238:8080/name/aggregation
# Circuit Breaker Configuration
resilience4j.circuitbreaker.instances.downstreamService.sliding-window-size=5
resilience4j.circuitbreaker.instances.downstreamService.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.downstreamService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.downstreamService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.downstreamService.permitted-number-of-calls-in-half-open-state=2

# Retry Configuration
resilience4j.retry.instances.downstreamService.max-attempts=3
resilience4j.retry.instances.downstreamService.wait-duration=1s